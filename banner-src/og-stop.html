<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@800;900&display=swap">
<style>
:root{--tinta:#15121f;--canary:oklch(90% .19 103);--turq:oklch(72% .13 210);--coral:oklch(68% .19 22);--lil:oklch(80% .11 292);--verde:oklch(86% .14 155);--papel:oklch(97% .01 95)}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#17142a;font-family:Nunito,sans-serif;font-weight:900;color:var(--papel);position:relative}
.b{position:absolute;border-radius:50%}
.esq{position:absolute;left:64px;top:70px;width:440px}
.tag{display:inline-block;font-family:Bungee;font-size:104px;line-height:1;padding:24px 34px 12px;background:var(--canary);color:var(--tinta);border:8px solid var(--papel);border-radius:34px;box-shadow:14px 14px 0 var(--papel);transform:rotate(-4deg)}
h2{font-family:Bungee;font-weight:400;font-size:38px;line-height:1.15;margin:60px 0 16px}
p{font-size:26px;line-height:1.3;margin:0;opacity:.85;font-weight:800}
.dir{position:absolute;right:50px;top:60px;width:450px;display:flex;flex-direction:column;gap:16px}
.letra{position:absolute;left:522px;top:392px;width:150px;height:150px;background:var(--canary);color:var(--tinta);font-family:Bungee;font-size:100px;display:flex;align-items:center;justify-content:center;border:7px solid var(--papel);border-radius:30px;box-shadow:12px 12px 0 var(--papel);transform:rotate(6deg);z-index:2}
.c{display:flex;align-items:center;gap:18px;padding:16px 22px;border:6px solid var(--papel);border-radius:24px;box-shadow:8px 8px 0 var(--papel);color:var(--tinta);font-size:34px}
.c i{font-style:normal;font-family:Bungee;font-size:26px;width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tinta);color:var(--papel);border-radius:14px;transform:rotate(-4deg);padding-top:3px}
</style></head><body>
<div class="b" style="width:120px;height:120px;left:-50px;bottom:-30px;background:var(--canary)"></div>
<div class="b" style="width:160px;height:160px;right:-60px;bottom:-60px;background:var(--turq)"></div>
<div class="b" style="width:90px;height:90px;left:640px;top:-45px;background:var(--coral)"></div>
<div class="esq">
  <div class="tag">STOP!</div>
  <h2>Só precisa de<br>papel e caneta</h2>
  <p>Sorteia os temas e a letra com cronômetro. Abre no celular, no PC ou na TV.</p>
</div>
<div class="dir">
  <div class="c" style="background:var(--turq)"><i>1</i>Animal</div>
  <div class="c" style="background:var(--coral)"><i>2</i>Comida de bar</div>
  <div class="c" style="background:var(--lil)"><i>3</i>Superpoder</div>
  <div class="c" style="background:var(--verde)"><i>4</i>Coisa gelada</div>
  <div class="c" style="background:var(--canary)"><i>5</i>Nome de remédio</div>
</div>
<div class="letra">M</div>
</body></html>
