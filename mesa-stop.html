<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa do Stop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap">
<style>
html,body{margin:0;background:#fff;font-family:"Nunito",sans-serif;}
svg{display:block;width:900px;height:900px}
.t{font-family:"Bungee",sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15121f"/>
    </marker>
  </defs>

  <text x="450" y="48" text-anchor="middle" class="t" font-size="30" fill="#15121f">Como a folha fica na mesa</text>
  <text x="450" y="78" text-anchor="middle" font-size="17" fill="#555">vista de cima · uma folha por mesa · cada pessoa preenche o lado virado pra ela</text>

  <!-- mesa -->
  <rect x="230" y="230" width="440" height="440" rx="28" fill="#d9b98c" stroke="#15121f" stroke-width="5"/>

  <!-- A4 retrato (210x297 → 210x297 px escalado 1:1) -->
  <g transform="translate(345,302)">
    <rect width="210" height="297" rx="6" fill="#fff" stroke="#15121f" stroke-width="3"/>
    <!-- faixas -->
    <rect x="8" y="225" width="194" height="64" rx="6" fill="oklch(72% .13 210)" stroke="#15121f" stroke-width="2"/>
    <rect x="8" y="8"   width="194" height="64" rx="6" fill="oklch(80% .11 292)" stroke="#15121f" stroke-width="2"/>
    <rect x="138" y="78" width="64" height="141" rx="6" fill="oklch(68% .19 22)" stroke="#15121f" stroke-width="2"/>
    <rect x="8" y="78"  width="64" height="141" rx="6" fill="oklch(86% .14 155)" stroke="#15121f" stroke-width="2"/>
    <rect x="78" y="100" width="54" height="97" rx="6" fill="oklch(90% .19 103)" stroke="#15121f" stroke-width="2"/>
    <!-- rótulos girados como na folha -->
    <text x="105" y="262" text-anchor="middle" class="t" font-size="13">TEMAS 1 e 2</text>
    <text transform="translate(105,40) rotate(180)" text-anchor="middle" dy="5" class="t" font-size="13">TEMAS 5 e 6</text>
    <text transform="translate(170,148) rotate(-90)" text-anchor="middle" dy="5" class="t" font-size="13">TEMAS 3 e 4</text>
    <text transform="translate(40,148) rotate(90)" text-anchor="middle" dy="5" class="t" font-size="13">TEMAS 7 e 8</text>
    <text x="105" y="146" text-anchor="middle" class="t" font-size="11">STOP!</text>
    <text x="105" y="162" text-anchor="middle" font-size="9" font-weight="800">letra + pontos</text>
    <text x="105" y="173" text-anchor="middle" font-size="9" font-weight="800">da mesa</text>
  </g>

  <!-- pessoas -->
  <g font-weight="800" font-size="18" fill="#15121f">
    <!-- baixo -->
    <circle cx="450" cy="745" r="38" fill="oklch(72% .13 210)" stroke="#15121f" stroke-width="4"/>
    <text x="450" y="752" text-anchor="middle" class="t" font-size="20">1</text>
    <text x="450" y="812" text-anchor="middle">Pessoa 1 · Temas 1 e 2</text>
    <line x1="450" y1="702" x2="450" y2="608" stroke="#15121f" stroke-width="3" marker-end="url(#seta)"/>

    <!-- direita -->
    <circle cx="745" cy="450" r="38" fill="oklch(68% .19 22)" stroke="#15121f" stroke-width="4"/>
    <text x="745" y="457" text-anchor="middle" class="t" font-size="20">2</text>
    <text x="745" y="518" text-anchor="middle">Pessoa 2</text>
    <text x="745" y="540" text-anchor="middle">Temas 3 e 4</text>
    <line x1="702" y1="450" x2="562" y2="450" stroke="#15121f" stroke-width="3" marker-end="url(#seta)"/>

    <!-- cima -->
    <circle cx="450" cy="155" r="38" fill="oklch(80% .11 292)" stroke="#15121f" stroke-width="4"/>
    <text x="450" y="162" text-anchor="middle" class="t" font-size="20">3</text>
    <text x="450" y="112" text-anchor="middle">Pessoa 3 · Temas 5 e 6</text>
    <line x1="450" y1="198" x2="450" y2="292" stroke="#15121f" stroke-width="3" marker-end="url(#seta)"/>

    <!-- esquerda -->
    <circle cx="155" cy="450" r="38" fill="oklch(86% .14 155)" stroke="#15121f" stroke-width="4"/>
    <text x="155" y="457" text-anchor="middle" class="t" font-size="20">4</text>
    <text x="155" y="518" text-anchor="middle">Pessoa 4</text>
    <text x="155" y="540" text-anchor="middle">Temas 7 e 8</text>
    <line x1="198" y1="450" x2="338" y2="450" stroke="#15121f" stroke-width="3" marker-end="url(#seta)"/>
  </g>

  <text x="450" y="860" text-anchor="middle" font-size="16" fill="#555">A cor de cada lado bate com a cor dos temas na TV · frente: rodadas 1–4 · verso: rodadas 5–8</text>
</svg>
</body>
</html>
