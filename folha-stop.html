<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folha do Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Folha individual, A4 deitado, preto e branco. Frente: rodadas normais. Verso: final. */
@page { size: A4 landscape; margin: 0; }
:root { --tinta: #000; --fd: "Bungee", system-ui, sans-serif; --ft: "Nunito", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #888; font-family: var(--ft); font-weight: 700; color: var(--tinta); }
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; justify-content: center; align-items: center; padding: 12px; background: #222; color: #fff; font-size: 15px; }
.toolbar button { font-family: var(--fd); font-size: 14px; padding: 10px 18px; border: 3px solid #000; border-radius: 999px; background: #fff; cursor: pointer; }
.page { width: 297mm; height: 210mm; margin: 10mm auto; background: #fff; padding: 9mm 10mm; display: flex; flex-direction: column; gap: 3mm; break-after: page; overflow: hidden; }
.page:last-child { break-after: auto; }
@media print { body { background: #fff; } .toolbar { display: none; } .page { margin: 0; } }

.head { display: flex; align-items: center; gap: 6mm; }
.logo { font-family: var(--fd); font-size: 10mm; line-height: 1; padding: 1.6mm 4mm 1mm; border: .8mm solid var(--tinta); border-radius: 3mm; transform: rotate(-2deg); }
.logo small { font-size: .5em; }
.campo { font-family: var(--fd); font-size: 4.2mm; display: flex; align-items: flex-end; gap: 2mm; }
.campo i { border-bottom: .45mm solid var(--tinta); height: 7mm; }
.campo.nome { flex: 1; } .campo.nome i { flex: 1; }
.campo.mesa i { width: 22mm; }
.regras { font-size: 3.5mm; line-height: 1.35; border: .4mm dashed var(--tinta); border-radius: 2mm; padding: 1.4mm 3mm; }
.regras b { font-family: var(--fd); font-weight: 400; }

table { width: 100%; flex: 1; border-collapse: collapse; table-layout: fixed; }
th, td { border: .45mm solid var(--tinta); }
th { font-family: var(--fd); font-weight: 400; font-size: 4mm; height: 9mm; padding: .6mm 0 0; background: #e6e6e6; }
th.peq { font-size: 3.2mm; }
td.k { font-family: var(--fd); font-size: 4mm; text-align: center; background: #f2f2f2; }
td.letra { border-width: .7mm; }
td.pts { border-left-width: .9mm; }
tr.total td { border-top-width: .9mm; height: 12mm; }
tr.total td.rot { font-family: var(--fd); font-size: 4.4mm; text-align: right; padding-right: 3mm; border: 0; }
.final .logo { background: #000; color: #fff; }
</style>
</head>
<body>
<div class="toolbar">Imprima em A4, frente e verso, uma folha por pessoa. Frente: rodadas · verso: final. <button onclick="print()">🖨 Imprimir</button></div>
<div id="pages"></div>
<script>
const TEMAS = 5, RODADAS = 8, FINAL = 4;
const cols = `<colgroup><col style="width:19mm"><col style="width:16mm">${"<col>".repeat(TEMAS)}<col style="width:20mm"></colgroup>`;
const thead = `<tr><th class="peq">Rodada</th><th class="peq">Letra</th>${Array.from({length:TEMAS},(_,i)=>`<th>Tema ${i+1}</th>`).join("")}<th class="peq">Pontos</th></tr>`;
function linhas(n){
  let r = "";
  for(let i=1; i<=n; i++) r += `<tr><td class="k">${i}</td><td class="letra"></td>${"<td></td>".repeat(TEMAS)}<td class="pts"></td></tr>`;
  return r + `<tr class="total"><td class="rot" colspan="${TEMAS+2}">Total</td><td class="pts"></td></tr>`;
}
const frente = `<section class="page">
  <div class="head"><div class="logo">STOP!</div><span class="campo nome">Nome<i></i></span><span class="campo mesa">Mesa<i></i></span></div>
  <div class="regras">Cada um por si. Os temas <b>1–5</b> são os da TV. Comparando só com a sua mesa:
    <b>10</b> só você · <b>5</b> repetida · <b>0</b> vazia. Mesma ideia conta como repetida (dançar = dança).
    Quem somar mais na mesa vai pra final, no verso.</div>
  <table>${cols}${thead}${linhas(RODADAS)}</table>
</section>`;
const verso = `<section class="page final">
  <div class="head"><div class="logo">FINAL</div><span class="campo nome">Nome<i></i></span><span class="campo mesa">Mesa<i></i></span></div>
  <div class="regras">Só quem foi pra final joga deste lado. Mesmas regras, agora comparando com todos os finalistas:
    <b>10</b> só você · <b>5</b> repetida · <b>0</b> vazia.</div>
  <table>${cols}${thead}${linhas(FINAL)}</table>
</section>`;
document.getElementById("pages").innerHTML = frente + verso;
</script>
</body>
</html>
